<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>
    <title>Scenario Generator</title>
  </head>
  <body>
    <div class="container">
      <header><h1>AI Scenario Generator</h1></header>
      <main>
        <form id="gnerator-scenario-form">
          <input
            type="text"
            placeholder="Enter your topic for your story..."
            autofocus
            required
            autocomplete="off"
            class="instruction"
            id="user-instruction"
          />
          <input type="submit" class="submit-button" />
        </form>
        <div id="scenario" class="scenario"></div>
      </main>
    </div>
    <footer>
      This AI project was coded by Olesia Kononova and is open-sourced on
      <a href="https://github.com/Olesia20/scenario-Generator-" target="_blank"
        >GitHub</a
      >
      and is hosted on
      <a href="https://ai-scenario-generator.netlify.app/" target="_blank"
        >Netlify</a
      >
    </footer>
    <script src="src/script.js"></script>
  </body>
</html>
